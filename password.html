<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>
  <script src="js/password.js" type="module" defer></script>
  
</head>
<body>
  <h1>Password Generator</h1>
  Enter password length (4-10 max)
  <br><br>
  <input type="number" placeholder="" class="character-length"><br>

  <p>Select charcters to include:</p>

  <form action="">
    <input type="checkbox" id="character1" name="uppercase">
    <label for="uppercase">uppercase</label><br>

    <input type="checkbox" id="character2" name="lowercase">
    <label for="lowercase">lowercase</label><br>

    <input type="checkbox" id="character3" name="number">
    <label for="number">number</label><br>

    <input type="checkbox" id="character4" name="symbols">
    <label for="symbols">symbol</label><br>
  </form>
  <br>

  <button class="generate-password">Generate password</button>
  <h5 class="new-password  "></h5>
</body>
</html>
