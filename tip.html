<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Calculator</title>
  <script src="js/tip.js" defer></script>
</head>
<body>
  <h1>Tip Calculator</h1>
  Bill Amount: <input type="number" placeholder="Enter ammount" class="bill-amount">
  <br><br>
  Tip (%): <input type="number" placeholder="40% max." class="tip-amount">

  <p class="display-bill">Bill: $0</p>
  <p class="display-tip">Tip: 0%</p>

  <p class="total-tip">Total tip:</p>
  <h4 class="total-bill">Total Amount:</h4>

  <button class="pay-btn">Pay</button>
</body>
</html>
